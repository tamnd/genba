name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel an in-flight run when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and test on Linux and macOS with the race detector on. gofmt and vet
  # run here too so a formatting slip fails fast on both platforms. Every test is
  # pure Go with no network, so there is nothing to install first.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1

  # The connectors on Windows, because one of them reads the security
  # descriptor of every file it indexes and there is no way to be sure that
  # code is right by cross compiling it. Nothing else in the tree asks the
  # operating system a question it can get wrong, so this stays narrow rather
  # than becoming a third row of the matrix above.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: test the connectors
        run: go test -count=1 ./connector/...

  # The Postgres driver against a real PostgreSQL 18. There is no in process
  # Postgres, so its tests skip without a server, and a driver whose suite
  # skipped in CI would be a green tick over nothing. That is what the last step
  # is for.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: genba
          POSTGRES_DB: genba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: server version
        run: docker exec $(docker ps -q -f ancestor=postgres:18) psql -U postgres -c 'select version()'
      - name: test
        shell: bash
        env:
          GENBA_TEST_POSTGRES: postgres://postgres:genba@127.0.0.1:5432/genba?sslmode=disable
        run: go test -race -count=1 -v ./store/pgstore/... | tee /tmp/pgstore.log
      - name: check the suite was not skipped
        run: |
          for name in TestConformance TestRetrieverConformance TestRankerConformance TestPermissionFilterIsInThePlan; do
            if ! grep -q -- "--- PASS: $name" /tmp/pgstore.log; then
              echo "$name did not run against the server, so this job proved nothing."
              exit 1
            fi
          done

  # The server also ships without the browser interface compiled in, and that
  # build has its own file in web/. Building and testing it here keeps the two
  # from drifting apart.
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: build without the interface
        run: go build -tags noassets ./...
      - name: test without the interface
        run: go test -tags noassets -count=1 ./...

  # The performance gate, in two halves.
  #
  # The counters assert work rather than wall clock: rows read, statements
  # issued, documents decoded, candidates ranked. A shared runner cannot measure
  # a millisecond and it can count rows exactly, so that half fails on a change
  # that makes a query walk the corpus and stays quiet when the runner is busy.
  #
  # The latency gate is the half the counters cannot do, which is a change that
  # does the same work more slowly. It compares against a baseline recorded on
  # this kind of runner, normalises by a calibration workload so a busy afternoon
  # is not read as a regression, and writes its numbers out either way. Until a
  # baseline recorded on the runner is committed it reports and does not fail,
  # and it says so in the log rather than passing quietly.
  #
  # The corpus is generated rather than committed, and cached on the hash of the
  # generator so that a run only pays for it when the generator changes. The
  # baseline is not in that cache on purpose: a number a stale cache can
  # overwrite is a number that stops meaning anything.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: cache the benchmark corpus
        uses: actions/cache@v6
        with:
          path: testdata
          key: benchcorpus-${{ hashFiles('benchcorpus/*.go', 'benchcorpus/gen/**', 'benchcorpus/queries.txt') }}
      - name: the corpus
        run: make bench-corpus
      - name: counters
        run: make bench-counters
      - name: latency
        env:
          GENBA_GATE_BASELINE: ${{ github.workspace }}/benchcorpus/baseline-ci.json
          GENBA_GATE_RUNNER: ubuntu-latest
        run: make bench-gate
      - name: keep the numbers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: bench-report.json
          if-no-files-found: warn

  # The browser gate: asset budgets, markup safety, the keyboard walk, axe and
  # Lighthouse.
  #
  # The Go tests are the part that cannot flake and they run first. The walk
  # presses the keys and clicks the links a person would and asserts where each
  # one led, which is the half an audit cannot see. axe reports violations of a
  # standard rather than an opinion. Both fail the job. Lighthouse is advisory
  # here and enforced on the nightly run, because a performance score on a
  # shared runner moves by ten points between two runs of the same commit.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: ui gate
        run: make ui-gate

  # The Rust engine, which nothing else in this file builds.
  #
  # Everything above runs with CGO off and never links it, and that is the
  # shipped binary. This job exists so the binding does not rot: the engine is a
  # separate repository that moves on its own, and a change to its ABI should
  # fail here rather than in somebody's build.
  #
  # It runs the race detector because a cgo boundary is where a pointer rule is
  # broken, and the leak tests because a missing free is invisible to Go.
  kura:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: cache the engine build
        uses: actions/cache@v6
        with:
          path: |
            third_party/kura-src/target
            ~/.cargo/registry
          key: kura-${{ runner.os }}-${{ hashFiles('scripts/kura.sh') }}
      - name: build the engine
        run: make kura
      - name: build against it
        run: make kura-build
      - name: test against it
        run: CGO_ENABLED=1 go test -race -count=1 -tags kura ./store/kura/
      # Again without the race detector, because it keeps shadow memory for
      # every address the program touches and grows the resident set as it
      # does, which is the measurement the leak tests read. They sit out the
      # pass above and run in this one.
      - name: test against it again, for the leaks
        run: CGO_ENABLED=1 go test -count=1 -tags kura ./store/kura/
      - name: the default build still refuses
        run: go test -count=1 ./store/kura/

  # The binary is meant to run on Windows too, and cross compiling catches the
  # path handling and syscall mistakes that only show up there.
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  # golangci-lint bundles staticcheck, govet, ineffassign, errcheck, unused and
  # more, so it is the main quality gate.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # Scan the module and its dependencies for known vulnerabilities.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # Confirm go.mod and go.sum are tidy: a pull request that adds an import
  # without running go mod tidy fails here instead of breaking a later release.
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # genba is MIT, so the allow-list is the permissive set only. A dependency
  # under a copyleft license fails the job here rather than at release time.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: go-licenses check
        run: |
          go install github.com/google/go-licenses@latest
          # modernc.org/mathutil ships the BSD 3-Clause text verbatim but
          # without the title line the classifier keys on, so it comes back as
          # unknown. It is checked by hand and it is BSD 3-Clause. It arrived
          # with the SQLite driver.
          go-licenses check ./... \
            --ignore modernc.org/mathutil \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,Unlicense,BSD-3-Clause-Clear
