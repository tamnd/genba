<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Search everything your company knows, with the permissions it already has." />
    <title>genba</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/assets/tokens.css" />
    <link rel="stylesheet" href="/assets/app.css" />
    <link rel="modulepreload" href="/assets/api.js" />
    <link rel="modulepreload" href="/assets/dom.js" />
    <script>
      // The theme is read before the first paint. Doing it in the module would
      // put a white frame in front of somebody who chose a dark theme.
      try {
        var saved = localStorage.getItem("genba.theme");
        if (saved) document.documentElement.dataset.theme = saved;
        else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <!--
      The shell is painted from markup rather than from script, so the layout is
      on screen at the first frame and nothing shifts when the module arrives.
      The script replaces this with the live version.
    -->
    <div id="app">
      <div class="app">
        <nav class="rail" aria-label="Main">
          <span class="brand"><span class="brand__mark">G</span>genba</span>
        </nav>
        <header class="header">
          <div class="omnibox" role="search">
            <div class="omnibox__field">
              <input class="omnibox__input" type="text" aria-label="Search" placeholder="Search everything, or type app: to filter" disabled />
            </div>
          </div>
        </header>
        <main class="main">
          <div class="home">
            <div class="home__grid">
              <div class="panel">
                <div class="skeleton" style="width: 40%; height: 14px; margin-bottom: 16px"></div>
                <div class="skeleton" style="width: 100%; height: 12px; margin-bottom: 10px"></div>
                <div class="skeleton" style="width: 88%; height: 12px; margin-bottom: 10px"></div>
                <div class="skeleton" style="width: 72%; height: 12px"></div>
              </div>
              <div class="panel">
                <div class="skeleton" style="width: 40%; height: 14px; margin-bottom: 16px"></div>
                <div class="skeleton" style="width: 100%; height: 12px; margin-bottom: 10px"></div>
                <div class="skeleton" style="width: 88%; height: 12px; margin-bottom: 10px"></div>
                <div class="skeleton" style="width: 72%; height: 12px"></div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <noscript>
      <p style="padding: 24px">
        genba needs JavaScript to search. The API under <code>/api/v1</code> works without it.
      </p>
    </noscript>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
