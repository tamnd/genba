# Prometheus alerting rules for genba.
#
# There are two alerts in here, and that is on purpose.
# An alert that nobody acts on trains everybody to ignore the ones that matter, so a rule earns its place by naming something a person would get out of bed for.
# Everything else worth watching is on a dashboard, where a number that is drifting can be looked at during working hours.
#
# The metric names come from api/metrics.go, where they are constants for exactly this reason.
# A rename that only edits the code leaves a rule here that will never fire again and will never say so.
#
# The metrics are served by the address in GENBA_METRICS_ADDR, which is off unless it is set and is meant to be somewhere the outside cannot reach.
# The API address does not serve them.
groups:
  - name: genba
    rules:
      # Search latency is the product.
      # Everything else genba does is in service of a query returning quickly, and when this fires the interface feels broken to everybody using it at once.
      #
      # The threshold is the pathological budget rather than the ordinary one.
      # The p95 of a healthy mix sits well under ten milliseconds, so twenty five means either the expensive query class has become the common one or something underneath has stopped using an index.
      # It is a bucket boundary too, which is what makes the quantile estimate here worth reading at all.
      #
      # Five minutes of it, because a single slow scrape is a garbage collection pause or a noisy neighbour and neither is a page.
      - alert: SearchIsSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(genba_search_duration_milliseconds_bucket[5m]))) > 25
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Search p95 is over 25ms
          description: >-
            The 95th percentile of search latency has been above 25ms for five minutes.
            Check genba_search_candidates first: a candidate count that has moved with the match count means the first phase of retrieval has stopped cutting.
            Check genba_cache_hits_total against genba_cache_misses_total next: a hit rate that has collapsed usually means something is writing to the corpus continuously and dropping the cached orderings as fast as they are built.

      # A record that could not be written is an access that happened and cannot be proved.
      # It earns the second alert because it is the only failure genba has that cannot be recovered by looking again later.
      # A slow query can be measured again tomorrow and a held document comes back after a sweep, but the request that served a document while the disk was full is over, and nothing in the process still knows about it.
      #
      # The threshold is any of them at all, because the trail is either complete or it is not, and a deployment that decides a few missing records a day is acceptable has decided its trail is not evidence.
      # Fifteen minutes, because the usual cause is a full disk or a directory that lost its permissions in a deployment, and both of those are still true fifteen minutes later.
      - alert: AuditRecordsAreBeingLost
        expr: increase(genba_audit_failed_total[15m]) > 0
        for: 15m
        labels:
          severity: page
        annotations:
          summary: Content access records are not being written
          description: >-
            The server served content it could not record. Check the disk the audit directory is on first, then its ownership, which is the usual pair of causes.
            Check genba_audit_queued_records next: a queue that is not draining is a sink that has started making requests wait rather than one that is dropping records, and it is the same underlying problem one step earlier.

# What is deliberately not alerted on, and why.
#
# Cache hit rate.
# It is a number to look at when something else is wrong rather than a reason to wake somebody, because a cold process and a busy crawl both push it down and neither is an incident.
#
# Quarantined documents.
# genba_quarantined_documents is a gauge and it is the only trace a held document leaves anywhere, so it is worth a panel and a threshold somebody looks at during working hours.
# It is not a page: a document whose permissions did not resolve is held back rather than served, which is the safe outcome, so a growing count is a bug report rather than a reason to wake somebody.
# The rule to write against it is a ratchet rather than a level, because a crawl of a source with a broken role mapping puts a few thousand in there legitimately and they come back on their own.
# Something like an increase over an hour on a deployment that is not crawling, or a count that has not fallen after a sweep, which is the retry having run and released nothing.
# The series disappears rather than reading zero when the store cannot answer, so a rule that has to be right about this pairs the threshold with absent().
#
# Directory staleness.
# genba_directory_staleness_seconds is a constant, so there is nothing in it to alert on.
# It is published because it is the answer to "how long after I remove somebody from a group does it take effect", and that question gets asked during an incident by somebody who cannot read the deployment's configuration.
# The layer next to it, genba_cache_hits_total{layer="directory"}, is the one to look at when sign in has become slow.
#
# Request duration per endpoint.
# It is the first thing to look at during an incident and it is too easy to page on: one slow endpoint that nobody uses would fire this every deploy.
# Search has its own alert above because search is the one endpoint that being slow means the product is down.
